<header class="header">

  <div class="logo-container">
    <img src="assets/logoWorkTrack.png" class="logo-small" />
    <h2 class="title">Work<span>Track</span></h2>
  </div>

  <nav>
    <a routerLink="/home">Inicio</a>
    <a *ngIf="!user" routerLink="/login">Login</a>
    <a *ngIf="!user" routerLink="/register">Registro</a>

    <span *ngIf="user" class="welcome">
      Hola, {{ user.email }}
    </span>

    <button *ngIf="user" (click)="logout()">Salir</button>
  </nav>

</header>
