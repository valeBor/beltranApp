<div class="login-container">

  <div class="card">

    <div class="logo">
      <img src="assets/logoWorkTrack.png" alt="WorkTrack logo">
      <h1>Work<span>Track</span></h1>
      <p>Control de asistencia con QR</p>
    </div>

    <h2>¡Bienvenido!</h2>
    <p class="subtitle">Ingresá tus datos para continuar</p>

    <!-- MENSAJES -->
    <p *ngIf="message" class="success">{{ message }}</p>
    <p *ngIf="error" class="error">{{ error }}</p>

    <form (ngSubmit)="onSubmit()">

      <div class="input-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          required 
        />
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          required 
        />
      </div>

      <button type="submit">Ingresar</button>

    </form>

    <p class="register">
      ¿No tenés cuenta?
      <a routerLink="/register">Registrarse</a>
    </p>

    <p class="footer">
      ✔ Seguro · Rápido · Con QR
    </p>

  </div>

</div>
