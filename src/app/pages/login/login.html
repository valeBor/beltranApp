<div class="auth-container">
  <h2>Iniciar sesión</h2>

  <form (ngSubmit)="onSubmit()">

    <div class="input-group">
      <label>Email</label>
      <input 
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        #emailRef="ngModel"
      />
      <small *ngIf="emailRef.invalid && emailRef.touched">
        Email inválido
      </small>
    </div>

    <div class="input-group">
      <label>Contraseña</label>
      <input 
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        minlength="6"
        #passRef="ngModel"
      />
      <small *ngIf="passRef.invalid && passRef.touched">
        Mínimo 6 caracteres
      </small>
    </div>

    <button type="submit">Ingresar</button>

  </form>

  <p>
    ¿No tenés cuenta? <a routerLink="/register">Registrarse</a>
  </p>
</div>
