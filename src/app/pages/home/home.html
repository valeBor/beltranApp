<div class="home">

  <h1>Bienvenido a Beltrán App</h1>

  <div *ngIf="user; else noLogeado">
    <p> </p>
    <p>{{ user.email }}</p>
    <div>
      <p><img src="assets/logoApp.jpg" alt="" class="img_logo_app"></p>
    </div>

    <button (click)="logout()">Cerrar sesión</button>
  </div>

  <ng-template #noLogeado>
    <p>No estás logueado</p>
  </ng-template>

</div>
