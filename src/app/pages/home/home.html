<div class="home">

  <h1 class="title">
    Work<span>Track</span>
  </h1>

  <p class="subtitle">
    Control de asistencia con QR
  </p>

  <!-- SI ESTÁ LOGUEADO -->
  <div *ngIf="user; else noLogin">

    <h2>Bienvenido {{ user.email }}</h2>
    <p>Ya podés registrar tu asistencia</p>

  </div>

  <!-- SI NO ESTÁ LOGUEADO -->
  <ng-template #noLogin>

    <p>No estás logueado</p>

    <button (click)="goLogin()" class="btn">
      Ir a Login
    </button>

  </ng-template>

</div>
